version: 2
updates:
  - package-ecosystem: npm
    directory: /yoshimi-secure-site
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    # 公開直後の版は乗っ取られたパッケージである恐れがあるので、7 日たってから取り込む
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
